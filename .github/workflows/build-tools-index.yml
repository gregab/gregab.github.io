name: Build tools index

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "scripts/build-index.js"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate tools.json
        run: node scripts/build-index.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- tools.json; then
            echo "tools.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools.json
          git commit -m "Update tools index [skip ci]"
          git push
