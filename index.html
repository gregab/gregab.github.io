<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools — gregab.github.io</title>
<meta name="description" content="A small, growing collection of single-page tools.">
<style>
  :root {
    --paper: #F2F3EE;
    --sheet: #FDFDFB;
    --ink: #22271F;
    --muted: #737A70;
    --rule: #CDD2C7;
    --rule-strong: #A9B0A2;
    --mark: 200, 206, 78;
    --focus: #3F5D8C;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 64px 20px 48px;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 620px; margin: 0 auto; }

  .eyebrow {
    font-size: 11.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
  }

  h1 {
    font-family: "Times New Roman", Times, serif;
    font-size: 42px;
    line-height: 1.1;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }

  .sub {
    margin: 0 0 40px;
    max-width: 46ch;
    color: var(--muted);
    font-size: 14.5px;
  }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  ol.toc {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--rule-strong);
  }

  .entry { border-bottom: 1px solid var(--rule); }

  .entry a {
    display: block;
    text-decoration: none;
    color: inherit;
    padding: 18px 10px 17px 2px;
    position: relative;
  }

  .entry a::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(var(--mark), 0);
    transition: background 0.18s ease;
    pointer-events: none;
  }

  .entry a:hover::before,
  .entry a:focus-visible::before {
    background: rgba(var(--mark), 0.16);
  }

  .row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .row .no {
    font-family: "Times New Roman", Times, serif;
    font-size: 13px;
    color: var(--muted);
    flex: none;
    width: 20px;
  }

  .row .title {
    font-family: "Times New Roman", Times, serif;
    font-size: 20px;
    line-height: 1.25;
    flex: none;
  }

  .entry a:hover .title,
  .entry a:focus-visible .title { text-decoration: underline; text-underline-offset: 3px; }

  .leader {
    flex: 1 1 auto;
    border-bottom: 1px dotted var(--rule-strong);
    height: 0;
    margin-bottom: 5px;
    min-width: 12px;
  }

  .row .arrow {
    flex: none;
    font-family: "Times New Roman", Times, serif;
    font-size: 15px;
    color: var(--muted);
    transition: transform 0.18s ease, color 0.18s ease;
  }

  .entry a:hover .arrow,
  .entry a:focus-visible .arrow { color: var(--focus); transform: translateX(2px); }

  .desc {
    margin: 5px 0 0 30px;
    color: var(--muted);
    font-size: 13px;
    max-width: 50ch;
  }

  .empty, .error {
    padding: 28px 0;
    color: var(--muted);
    font-size: 13.5px;
    border-top: 1px solid var(--rule-strong);
  }
  .empty code, .error code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: rgba(var(--mark), 0.18);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--ink);
  }

  footer {
    margin-top: 34px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
    font-size: 12px;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .entry a::before, .row .arrow { transition: none; }
  }

  @media (max-width: 480px) {
    body { padding: 44px 16px 40px; }
    h1 { font-size: 34px; }
    .row .title { font-size: 18px; }
    .desc { margin-left: 30px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">gregab.github.io</p>
    <h1>Tools</h1>
    <p class="sub">Small single-page tools — no build step, no account. Pick one below.</p>

    <ol class="toc" id="toc" aria-live="polite"></ol>

    <footer id="footer"></footer>
  </div>

  <script>
  (function () {
    var toc = document.getElementById('toc');
    var footer = document.getElementById('footer');

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function render(manifest) {
      var tools = (manifest && manifest.tools) || [];

      if (!tools.length) {
        toc.innerHTML = '';
        var empty = document.createElement('li');
        empty.className = 'empty';
        empty.innerHTML = 'No tools yet. Drop an HTML file into <code>/tools</code> and push — this page rebuilds itself.';
        toc.appendChild(empty);
        footer.textContent = '';
        return;
      }

      toc.innerHTML = '';
      tools.forEach(function (tool, i) {
        var li = document.createElement('li');
        li.className = 'entry';

        var a = document.createElement('a');
        a.href = 'tools/' + tool.file;

        var row = document.createElement('div');
        row.className = 'row';

        var no = document.createElement('span');
        no.className = 'no';
        no.textContent = pad(i + 1);

        var title = document.createElement('span');
        title.className = 'title';
        title.textContent = tool.title;

        var leader = document.createElement('span');
        leader.className = 'leader';
        leader.setAttribute('aria-hidden', 'true');

        var arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.setAttribute('aria-hidden', 'true');
        arrow.textContent = '→';

        row.appendChild(no);
        row.appendChild(title);
        row.appendChild(leader);
        row.appendChild(arrow);
        a.appendChild(row);

        if (tool.description) {
          var desc = document.createElement('p');
          desc.className = 'desc';
          desc.textContent = tool.description;
          a.appendChild(desc);
        }

        li.appendChild(a);
        toc.appendChild(li);
      });

      var count = tools.length + (tools.length === 1 ? ' tool' : ' tools');
      footer.textContent = count + ' · index rebuilds automatically when one is added';
    }

    fetch('tools.json', { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('missing manifest');
        return res.json();
      })
      .then(render)
      .catch(function () {
        toc.innerHTML = '';
        var err = document.createElement('li');
        err.className = 'error';
        err.innerHTML = 'Couldn’t load <code>tools.json</code>. Run <code>node scripts/build-index.js</code> and push.';
        toc.appendChild(err);
      });
  })();
  </script>
</body>
</html>
